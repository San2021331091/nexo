name: nexo
description: Guest first streaming discovery for live TV, movies, and series.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  dio: ^5.7.0
  get_storage: ^2.1.1
  go_router: ^14.6.2
  video_player: ^2.9.2
  youtube_player_iframe: 6.0.2
  url_launcher: ^6.3.1
  flutter_svg: ^2.2.3
  flutter_inappwebview: 6.2.0-beta.3
  flutter_dotenv: ^6.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/nexo-logo.png
    - .env
    
